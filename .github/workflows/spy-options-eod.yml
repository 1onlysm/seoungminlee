name: NAVI OPTIONS LAB API diagnostic (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Nasdaq options chain without changing collector
        shell: bash
        run: |
          python - <<'PY'
          import json, re, time, urllib.request, urllib.error
          from collections import Counter
          from pathlib import Path
          tickers = {"SPY":"etf","QQQ":"etf","SOXX":"etf","NVDA":"stocks","AMD":"stocks","TSLA":"stocks","MSTR":"stocks","PLTR":"stocks","MU":"stocks","CRWV":"stocks"}
          fields = ("c_Volume","p_Volume","c_Openinterest","p_Openinterest")
          results = {}
          for ticker, assetclass in tickers.items():
              url = f"https://api.nasdaq.com/api/quote/{ticker}/option-chain?assetclass={assetclass}&limit=20000&fromdate=all"
              record = {"ticker":ticker,"assetclass":assetclass,"http_status":None,"api_status":None,"status":"UNVERIFIED"}
              try:
                  request = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36","Accept":"application/json","Referer":"https://www.nasdaq.com/"})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      record["http_status"] = response.status
                      raw = response.read(25000001)
                  if len(raw) > 25000000:
                      raise ValueError("response exceeds 25 MB")
                  payload = json.loads(raw)
                  record["api_status"] = (payload.get("status") or {}).get("rCode")
                  data = payload.get("data") or {}
                  rows = (data.get("table") or {}).get("rows")
                  if not isinstance(rows, list):
                      raise ValueError("missing option rows")
                  contracts = [r for r in rows if isinstance(r,dict) and r.get("strike")]
                  groups = [r.get("expirygroup") for r in rows if isinstance(r,dict) and r.get("expirygroup")]
                  roots = Counter()
                  for row in contracts:
                      m = re.search(r"/([a-z0-9]+)-+\d{6}c\d+", row.get("drillDownURL") or "", re.I)
                      roots[m.group(1).upper() if m else "UNKNOWN"] += 1
                  record.update({"reported_total":data.get("totalRecord"),"row_count":len(rows),"contract_rows":len(contracts),"expiry_groups":len(groups),"expiry_count":len(set(groups)),"root_counts":dict(roots),"field_present":{f:sum(f in r for r in contracts) for f in fields},"field_missing":{f:sum(r.get(f) in (None,"","--") for r in contracts) for f in fields},"strike_present":sum(r.get("strike") not in (None,"","--") for r in contracts)})
                  record["status"] = "RESPONDED_UNVERIFIED" if record["http_status"] == 200 and record["api_status"] == 200 and len(contracts)>0 else "UNUSABLE_RESPONSE"
              except urllib.error.HTTPError as exc:
                  record["http_status"] = exc.code
                  record["error"] = f"HTTPError: {exc.reason}"
              except Exception as exc:
                  record["error"] = f"{type(exc).__name__}: {str(exc)[:250]}"
              results[ticker] = record
              print(json.dumps(record,ensure_ascii=False),flush=True)
              time.sleep(1)
          Path("options-api-diagnostic.json").write_text(json.dumps({"approved_for_navi":False,"results":results},ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Upload diagnostic results
        uses: actions/upload-artifact@v4
        with:
          name: options-api-diagnostic-${{ github.run_id }}
          path: options-api-diagnostic.json
          if-no-files-found: error
          retention-days: 30
