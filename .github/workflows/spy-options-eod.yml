name: SPY QQQ SOXX Nasdaq options experimental EOD
on:
  workflow_dispatch:
  schedule:
    # 07:05 KST every weekday, regardless of US daylight saving time.
    # 17:05 EST / 18:05 EDT; one cron prevents duplicate scheduled collections.
    - cron: '5 22 * * 1-5'
permissions:
  contents: read
concurrency:
  group: multi-options-experimental
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect SPY QQQ SOXX options (allow delayed schedule, require NY post-close)
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, time, timezone
          from zoneinfo import ZoneInfo
          import sys
          now = datetime.now(timezone.utc)
          kst = now.astimezone(ZoneInfo("Asia/Seoul"))
          ny = now.astimezone(ZoneInfo("America/New_York"))
          print(f"Execution time: UTC={now.isoformat()} KST={kst.isoformat()} NY={ny.isoformat()}", flush=True)
          # GitHub schedule start times are not guaranteed; do not reject delayed runs
          # solely because the original 07:30 KST target has passed.
          if ny.weekday() >= 5 or ny.time() < time(16, 30):
              sys.exit("FAILED: outside New York weekday post-close collection window")
          PY
          python collector.py
      - name: Verify per-ticker output and manifest
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          dirs = [p for p in Path("output").glob("*") if p.is_dir()]
          if len(dirs) != 1:
              raise SystemExit("FAILED: expected one snapshot directory")
          d = dirs[0]
          manifest = json.loads((d / "collection_manifest.json").read_text())
          if manifest.get("approved_for_navi") is not False:
              raise SystemExit("FAILED: manifest approved_for_navi must be false")
          for ticker in ("SPY", "QQQ", "SOXX"):
              result = manifest["results"][ticker]
              if result["status"] == "FAILED":
                  print(f"UNAVAILABLE: {ticker}: {result['reason']}")
                  if ticker == "SPY":
                      raise SystemExit("FAILED: baseline SPY missing")
                  continue
              folder = d / ticker
              for name in ("summary.json", "contracts.csv", "experimental_metrics.json"):
                  if not (folder / name).is_file() or (folder / name).stat().st_size == 0:
                      raise SystemExit(f"FAILED: {ticker}/{name} missing")
              summary = json.loads((folder / "summary.json").read_text())
              metrics = json.loads((folder / "experimental_metrics.json").read_text())
              with (folder / "contracts.csv").open(newline="") as fh:
                  rows = list(csv.DictReader(fh))
              if not rows or len(rows) != summary["contract_rows"] or summary["ticker"] != ticker:
                  raise SystemExit(f"FAILED: {ticker} contract count or identity mismatch")
              if summary.get("approved_for_navi") is not False or metrics.get("approved_for_navi") is not False:
                  raise SystemExit(f"FAILED: {ticker} cannot be approved")
              print(f"VERIFIED_OUTPUT: {ticker} contracts={len(rows)} status={summary['status']}")
          PY
      - name: Upload experimental summary and contract CSV
        uses: actions/upload-artifact@v4
        with:
          name: multi-options-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 30
