name: NAVI OPTIONS LAB SPY offline quality regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: options-spy-work10b-offline
  cancel-in-progress: false
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regression suite only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m unittest discover -s tests -v 2>&1 | tee evidence/offline-tests.log
      - name: Validate explicitly synthetic fixture output
        shell: bash
        run: |
          set -euo pipefail
          python collector.py --mode offline --fixture tests/fixtures/nasdaq_spy_valid_synthetic.json --output "$RUNNER_TEMP/navi-options-work10b"
          python - "$RUNNER_TEMP/navi-options-work10b" <<'PY'
          import sys
          from pathlib import Path
          from options_pipeline.workflow_gate import validate_required_output
          root = Path(sys.argv[1])
          manifests = list(root.glob("data/options/*/SPY/*/manifest.json"))
          if len(manifests) != 1:
              raise SystemExit(f"FAILED: expected one offline fixture snapshot; found {len(manifests)}")
          result = validate_required_output(manifests[0].parent, require_live=False)
          if result["manifest"].get("evidence_kind") != "SYNTHETIC_OFFLINE_FIXTURE":
              raise SystemExit("FAILED: synthetic fixture is not labeled")
          print(f"OFFLINE_ONLY_OK: {result['record_count']} normalized records; synthetic fixture, not Nasdaq evidence")
          PY
      - name: Preserve offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: options-spy-work10b-offline-${{ github.run_id }}
          path: |
            evidence/
            ${{ runner.temp }}/navi-options-work10b/data/options/
          if-no-files-found: warn
          retention-days: 14

